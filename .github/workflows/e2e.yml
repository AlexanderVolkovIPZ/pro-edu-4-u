name: Bidium E2E (TAF)

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [staging, dev, prod]
        default: staging
      tags:
        description: Test tags (grep)
        type: choice
        options: ['@regression', '@smoke', '@api', '@gui']
        default: '@regression'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ${{ inputs.environment || 'staging' }}
  TAGS: ${{ inputs.tags || '@regression' }}

jobs:
  tests:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false            # a failure in one browser does not stop the others
      matrix:
        project: [api, chromium, firefox, webkit]   # parallelization across machines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - name: Install browser
        if: matrix.project != 'api'
        working-directory: e2e
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Run tests
        env:
          CI: true                  # workers: 4, retries: 1 (see playwright.config.ts)
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.project }} --grep "${{ env.TAGS }}"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: e2e/allure-results
          retention-days: 14

  report:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: e2e/allure-results
          merge-multiple: true
      - name: Build Allure report
        working-directory: e2e
        run: npx allure generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: e2e/allure-report
          retention-days: 14

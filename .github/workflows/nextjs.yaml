name: Next.js CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🟢 Setup Node.js with cache
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Show environment info
        run: |
          node -v
          npm -v
          npx next --version

      - name: ✅ Lint project
        run: npm run lint

      - name: 🔨 Build project
        run: npm run build

      # Optional: run tests
      # - name: 🧪 Run tests
      #   run: npm run test

      # Optional: upload build artifacts
      # - name: Upload build
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: nextjs-build
      #     path: .next

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Successful</title>
  </head>
  <body
    style="
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    "
  >
    <div
      style="
        width: 100%;
        max-width: 500px;
        margin: auto;
        background: #ffffff;
        padding: 40px;
        text-align: center;
        border-radius: 10px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      "
    >
      <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 20px">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="font-size: 48px; color: #10b981; margin-bottom: 20px"
        >
          <path d="M9 12l2 2l4 -4"></path>
          <circle cx="12" cy="12" r="10"></circle>
        </svg>
      </div>
      <h1 style="color: #333; font-size: 28px; margin-bottom: 10px">Registration Successful!</h1>
      <p style="color: #555; font-size: 16px; margin-bottom: 30px">
        Your account has been created successfully. You can now log in and start using our services.
      </p>
      <a
        href="/sign-in"
        style="
          display: inline-block;
          padding: 12px 25px;
          color: #ffffff;
          background-color: #f43f5e;
          text-decoration: none;
          border-radius: 5px;
          font-size: 16px;
          cursor: pointer;
          transition: background-color 0.3s ease;
        "
        >Log In</a
      >
    </div>
  </body>
</html>
